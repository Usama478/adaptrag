[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptrag"
version = "0.1.0"
description = "Document-aware RAG notebook"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "python-multipart",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pymupdf>=1.24",
    # Local, free, reproducible embeddings (BAAI/bge-small-en-v1.5, notes 0010 and 0012).
    "sentence-transformers>=6.2",
    # SQLAlchemy column type for the Postgres vector extension (note 0013).
    "pgvector>=0.3",
    # Official OpenAI client for answers: retries, timeouts, typed responses (note 0015).
    # 1.66 is the first release with the Responses API (client.responses.create).
    "openai>=1.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow tests load a real model; run them with `python -m pytest -m slow`.
addopts = "-m 'not slow'"
markers = ["slow: loads a real model (excluded by default; run with -m slow)"]
